name: Tests

# The full suite on every push and PR. manta is a dependency of the
# robot software (shiver) — nothing lands without the 700+ tests green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,jax]"

      - name: Static checks
        run: ruff check manta tests

      - name: Build package
        run: python -m build

      - name: Run the suite
        # GitHub runners have 4 cores / 16 GB — the pyproject maxprocesses
        # cap keeps the CasADi-heavy workers within memory either way.
        # The cc-gated codegen tests run (runners ship gcc). The emcc-gated
        # WASM roundtrips skip HERE and run in the `wasm` job below, where a
        # missing toolchain is a failure, not a skip.
        run: pytest -q

  wasm:
    # The WebAssembly backend is part of the compiled-parity net (doctrine
    # rule 17): generate, build with Emscripten, and run under node. No
    # package `.wasm` binaries are committed (the only built bundles live
    # under the out-of-package website demo), so there is nothing to
    # staleness-check; the roundtrip itself is the evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.70"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Toolchain must be present
        run: emcc --version && node --version

      - name: WASM roundtrips (a missing toolchain fails, never skips)
        env:
          MANTA_REQUIRE_WASM_TOOLCHAIN: "1"
        run: pytest -q -n0 tests/test_codegen_wasm.py
