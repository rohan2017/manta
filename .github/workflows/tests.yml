name: Tests

# The full suite on every push and PR. manta is a dependency of the
# robot software (shiver) — nothing lands without the 700+ tests green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,jax]"

      - name: Run the suite
        # GitHub runners have 4 cores / 16 GB — the pyproject maxprocesses
        # cap keeps the CasADi-heavy workers within memory either way.
        # The cc-gated codegen tests run (runners ship gcc); emcc-gated
        # WASM roundtrips self-skip.
        run: pytest -q
